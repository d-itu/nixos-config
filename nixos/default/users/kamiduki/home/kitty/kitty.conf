modify_font underline_thickness 50%
modify_font underline_position 1

box_drawing_scale 0.001, 0.4, 1, 1.5

cursor #d4d6e9
cursor_blink_interval 0
cursor_trail 1
cursor_trail_start_threshold 0

enable_audio_bell no

scrollbar_handle_opacity 0.1

paste_actions no-op
strip_trailing_spaces smart

default_pointer_shape arrow
mouse_hide_wait 0

mouse_map right press ungrabbed paste_from_clipboard
mouse_map left click ungrabbed
mouse_map ctrl+left click ungrabbed mouse_click_url_or_select

window_border_width 0
draw_minimal_borders no
placement_strategy top-left
hide_window_decorations yes
confirm_os_window_close 0

background_opacity 0.71

foreground #dee2e5
background #1e1c22

selection_foreground #efe2ca
selection_background #4f405a

color0 #31303c
color1 #d55e69
color2 #a0b049
color3 #d7a868
color4 #6c8ebf
color5 #9e82c9
color6 #73af9c
color7 #d0c8ce

color8  #7c7a80
color9  #e9948f
color10 #c0d461
color11 #fad791
color12 #9ab9e1
color13 #c3a6e9
color14 #9ac2b8
color15 #f0ecea

include ~/.config/kitty/themes/noctalia.conf

map super+enter new_os_window_with_cwd
map ctrl+alt+shift+j new_os_window_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+equal change_font_size current +0.5
map ctrl+minus change_font_size current -0.5
map ctrl+shift+l no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
map ctrl+shift+q no_op
